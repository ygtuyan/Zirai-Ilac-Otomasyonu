<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Çiftçi Bilgisi Güncelle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning"><h5>Çiftçi Kaydını Düzenle</h5></div>
                    <div class="card-body">
                        <form action="/musteri-guncelle/{{ kisi.ID }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Adı Soyadı</label>
                                <input type="text" name="ad_soyad" class="form-control" value="{{ kisi['Ad Soyad'] }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">TC Kimlik No</label>
                                <input type="text" name="tc_no" class="form-control" maxlength="11" value="{{ kisi.TCKN }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefon</label>
                                <input type="text" name="telefon" class="form-control" value="{{ kisi.Telefon }}" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 mb-2">Değişiklikleri Kaydet</button>
                            <a href="/" class="btn btn-secondary w-100">İptal Et ve Geri Dön</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
